<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      // GitHub Pages SPA redirect: send all 404s back to the app root
      var seg = window.location.pathname.replace('/prompt-craft-projects', '') || '/';
      window.location.replace(
        '/prompt-craft-projects/' +
          '?p=' +
          encodeURIComponent(seg) +
          window.location.search.slice(1) +
          window.location.hash
      );
    </script>
  </head>
</html>
